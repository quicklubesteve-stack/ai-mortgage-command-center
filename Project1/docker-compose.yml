version: '3.8'

services:
  mortgage-agent:
    build: .
    container_name: mortgage-agent-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgres://underwriter:secure_pass123@postgres-db:5432/mortgage_db
      - HUMAN_OFFICER_NAME=Steve
    depends_on:
      - postgres-db
    restart: always

  postgres-db:
    image: postgres:16-alpine
    container_name: mortgage-postgres
    environment:
      - POSTGRES_USER=underwriter
      - POSTGRES_PASSWORD=secure_pass123
      - POSTGRES_DB=mortgage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
